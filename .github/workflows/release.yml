name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "版本号（不带 v），例如 0.1.0"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  verify:
    name: Test
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Show toolchain
        run: xcodebuild -version
      - name: Run unit tests
        shell: bash
        run: |
          set -o pipefail
          mkdir -p build
          if ! xcodebuild -project Cap.xcodeproj -scheme Cap \
              -destination 'platform=macOS' \
              -derivedDataPath build/ci-tests \
              CODE_SIGN_IDENTITY="-" CODE_SIGN_STYLE=Manual \
              test 2>&1 | tee build/ci-test.log; then
            echo "::group::xcodebuild diagnostics"
            grep -nE "error:|fatal error:" build/ci-test.log | head -80 || true
            echo "::endgroup::"
            exit 1
          fi

      - name: Upload test log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ci-test-log
          path: build/ci-test.log

  release:
    name: Build & publish
    needs: verify
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: Resolve version
        id: v
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            VERSION="${{ inputs.version }}"
          else
            VERSION="${GITHUB_REF_NAME#v}"
          fi
          if [[ -z "$VERSION" ]]; then
            echo "无法从 tag 或输入解析版本号" >&2
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

      - name: Show toolchain
        run: xcodebuild -version

      - name: Build & package (ad-hoc signed)
        shell: bash
        env:
          CODE_SIGN_IDENTITY: "-"
        run: |
          set -o pipefail
          if ! Scripts/make-release.sh "${{ steps.v.outputs.version }}" 2>&1 | tee build/release.log; then
            echo "::group::release build diagnostics"
            grep -nE "error:|fatal error:" build/release.log | head -80 || true
            echo "::endgroup::"
            exit 1
          fi

      - name: Upload release log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: release-build-log
          path: build/release.log

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ steps.v.outputs.tag }}"
          TITLE="Cap ${{ steps.v.outputs.version }}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG 已存在：更新说明并覆盖附件"
            gh release edit "$TAG" --title "$TITLE" --notes-file dist/release-notes.md
            gh release upload "$TAG" dist/*.zip dist/*.dmg --clobber
          else
            gh release create "$TAG" dist/*.zip dist/*.dmg \
              --title "$TITLE" --notes-file dist/release-notes.md
          fi
